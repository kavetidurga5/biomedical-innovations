<script>
  function escapeHtml(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  const params = new URLSearchParams(window.location.search);
  const projectId = params.get("id");

  if (!projectId) {
    document.getElementById("project-title").textContent = "No project specified";
  } else {
    fetchAllTabs().then(({ dashboard, roster, presentations }) => {
      const project = dashboard.find(r => r["Project"] === projectId);
      const team = roster.filter(r => r["Project"] === projectId);
      const pres = presentations.filter(r => r["Project"] === projectId);

      // ── Header / status ──
      document.getElementById("project-title").textContent = projectId;

      if (project) {
        document.getElementById("project-stage").textContent = project["Current Stage"] || "Not yet set";
        document.getElementById("project-health").textContent =
          `${project["Overall Health"] || "Unknown"} — next presentation: ${project["Next Presentation"] || "TBD"}`;
      } else {
        document.getElementById("project-stage").textContent = "No dashboard entry found for this project.";
        document.getElementById("project-health").textContent = "—";
      }

      // ── Team ──
      const teamEl = document.getElementById("team-list");
      if (team.length) {
        teamEl.innerHTML = team.map(t => `
          <div class="team-member">
            <div class="team-member-name">${escapeHtml(t["Student Name"])}</div>
            <div class="team-member-role">${escapeHtml(t["Role / Attribution Note"] || t["Status"] || "")}</div>
          </div>`).join("");
      } else {
        teamEl.innerHTML = `<p class="state-message">Team roster not yet populated for this project.</p>`;
      }

      // ── Presentations ──
      const presEl = document.getElementById("presentations-row");
      if (pres.length) {
        presEl.innerHTML = pres.map(p => `
          <div class="conf-pill">
            <span class="conf-pill-icon">📋</span>
            <div class="conf-pill-text">
              <span class="conf-pill-name">${escapeHtml(p["Presentation Type"] || "Presentation")}</span>
              <span class="conf-pill-date">${escapeHtml(p["Date"] || "")} · ${escapeHtml(p["Prep Status"] || "")}${p["Owner"] ? " · " + escapeHtml(p["Owner"]) : ""}</span>
            </div>
          </div>`).join("");
      } else {
        presEl.innerHTML = `<p class="state-message">No presentations scheduled yet.</p>`;
      }
    }).catch(err => {
      console.error(err);
      document.getElementById("project-title").textContent = "Couldn't load project data";
    });
  }
</script>
